name: Deploy — Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Déploiement backend sur Cloud Run
    runs-on: ubuntu-latest
    needs: []
    # Ne déployer que si le backend a changé
    steps:
      - uses: actions/checkout@v4

      - name: Check if backend changed
        id: changed
        uses: tj-actions/changed-files@v45
        with:
          files: backend/**

      - name: Setup gcloud
        if: steps.changed.outputs.any_changed == 'true'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true

      - name: Configure docker
        if: steps.changed.outputs.any_changed == 'true'
        run: gcloud auth configure-docker

      - name: Build and deploy
        if: steps.changed.outputs.any_changed == 'true'
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: europe-west1
          SERVICE_NAME: veille-backend
        run: |
          IMAGE="gcr.io/${PROJECT_ID}/${SERVICE_NAME}"
          cd backend
          gcloud builds submit --tag "${IMAGE}" --project="${PROJECT_ID}"
          gcloud run deploy "${SERVICE_NAME}" \
            --image "${IMAGE}" \
            --platform managed \
            --region "${REGION}" \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --timeout 300 \
            --set-env-vars "GCP_PROJECT=${PROJECT_ID}" \
            --set-secrets "LINKEDIN_ACCESS_TOKEN=LINKEDIN_ACCESS_TOKEN:latest,LINKEDIN_PERSON_URN=LINKEDIN_PERSON_URN:latest" \
            --project="${PROJECT_ID}"

      - name: Get service URL
        if: steps.changed.outputs.any_changed == 'true'
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: europe-west1
        run: |
          URL=$(gcloud run services describe veille-backend --region "${REGION}" --format 'value(status.url)' --project="${PROJECT_ID}")
          echo "Backend URL: ${URL}"
