<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <script>if(location.hostname==='renaudsecq59.github.io'){location.replace('https://renaudsecq.com'+location.pathname.replace('/mia-chatbot','')+location.search+location.hash)}</script>
  <title>LinkedIn — Autorisation réussie</title>
  <style>
    body { font-family: 'Inter', sans-serif; background: #0c0c0c; color: #f0f0f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: #111; border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: 40px; max-width: 500px; text-align: center; }
    h1 { font-size: 24px; margin-bottom: 16px; }
    .code { background: #1a1a1a; border: 1px solid #c8ff00; border-radius: 8px; padding: 16px; font-family: monospace; font-size: 14px; word-break: break-all; margin: 20px 0; color: #c8ff00; cursor: pointer; }
    .code:hover { background: #222; }
    p { color: #999; font-size: 14px; line-height: 1.6; }
    .btn { background: #c8ff00; color: #000; border: none; padding: 10px 24px; border-radius: 100px; font-weight: 600; cursor: pointer; font-size: 14px; margin-top: 12px; }
    .btn:hover { background: #b8ef00; }
    .error { color: #ff6b6b; }
    .success { color: #c8ff00; }
  </style>
</head>
<body>
  <div class="card">
    <div id="content"></div>
  </div>
  <script>
    const BACKEND = 'https://veille-backend-791183172510.europe-west1.run.app';
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const error = params.get('error');
    const el = document.getElementById('content');

    if (error) {
      el.innerHTML = `<h1 class="error">❌ Erreur LinkedIn</h1><p>${params.get('error_description') || error}</p>`;
    } else if (code) {
      el.innerHTML = `<h1>⏳ Échange du token en cours...</h1><p>Connexion au backend…</p>`;
      fetch(`${BACKEND}/auth/linkedin/callback?code=${encodeURIComponent(code)}&state=${params.get('state') || ''}`)
        .then(r => r.json())
        .then(d => {
          if (d.status === 'ok') {
            el.innerHTML = `
              <h1 class="success">✅ Token LinkedIn renouvelé !</h1>
              <p>${d.message}</p>
              <p style="margin-top:16px;font-size:12px;color:#666;">Stocké dans Secret Manager — aucune action requise.</p>
            `;
          } else {
            el.innerHTML = `<h1 class="error">❌ Erreur</h1><pre style="font-size:12px;text-align:left">${JSON.stringify(d,null,2)}</pre>`;
          }
        })
        .catch(e => {
          el.innerHTML = `<h1 class="error">❌ Erreur réseau</h1><p>${e.message}</p>`;
        });
    } else {
      el.innerHTML = `<h1>⏳ En attente d'autorisation LinkedIn...</h1>`;
    }
  </script>
</body>
</html>
